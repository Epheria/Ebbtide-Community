name: Community work coordinator

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Work-order issue number
        required: true
        type: string
      command:
        description: Command (approval still requires the designated reviewer)
        required: true
        type: choice
        options: [assign, preview, approve, release, sync]
      digest:
        description: Full snapshot digest for approve
        required: false
        type: string

permissions:
  contents: read

# CAS in the state branch is the correctness guard, including cancelled queued runs.
# GitHub can replace a pending run; its issue command can safely be retried.
concurrency:
  group: community-work-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/work ')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'community/sheet-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record trusted checkout
        run: echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Process work command
        run: python tools/contribution_bot.py
        env:
          GH_TOKEN: ${{ github.token }}
