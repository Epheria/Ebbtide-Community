name: Reviewed contribution delivery policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [edited, deleted]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  delivery-policy:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/work approve ') ||
        startsWith(github.event.changes.body.from, '/work approve ') ||
        startsWith(github.event.comment.body, '/voice approve ') ||
        startsWith(github.event.changes.body.from, '/voice approve ')))
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code executes. PR blobs are read as data via API.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record trusted checkout
        run: echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify the approved export
        run: python tools/check_sheet_delivery.py
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.number }}
