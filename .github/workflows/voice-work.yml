name: Voice recording coordinator

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Voice work-order issue number
        required: true
        type: string
      command:
        description: Administrative command; reviewer approval must be an issue comment
        required: true
        type: choice
        options: [assign, preview, release, sync]

permissions:
  contents: read

# Atomic, non-force state-branch updates remain the overlap guard.
concurrency:
  group: community-voice-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/voice ')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'community/voice-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record trusted checkout
        run: echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Process voice command
        run: python tools/voice_submission_bot.py
        env:
          GH_TOKEN: ${{ github.token }}
