name: Check translations

on:
  pull_request:
    paths:
      - "localization/**"
      - "tools/l10n.py"
  push:
    branches: [main]
    paths:
      - "localization/**"
      - "tools/l10n.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/l10n.py check
