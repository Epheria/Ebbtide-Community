name: Check translations

# Runs on every pull request, not only on translation changes: main requires this check,
# and a required check that never runs would block voice-only pull requests forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/l10n.py check
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_drive_voice_bridge.js
